baseURL = 'https://blog-nzn.pages.dev/'
languageCode = 'ko-kr'
title = '셀다'
theme = 'PaperMod'

[pagination]
  pagerSize = 10

[params]
  env = 'production'
  title = '셀다'
  description = '셀다 - self damagochi'
  author = 'HOYAN'
  mainSections = ["posts"]
  
  defaultTheme = 'light'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true

  # 상단 로고 이미지 설정 (텍스트 대신 이미지 노출)
  [params.label]
    text = ""
    icon = "/images/logo.png"
    iconHeight = 36

  # 오른쪽 상단의 '셀다' 제목 텍스트 숨김 (로고 이미지로 대체됨)
  hideTitle = true

[[menu.main]]
  identifier = "posts"
  name = "전체 글"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "categories"
  name = "카테고리"
  url = "/categories/"
  weight = 20

[[menu.main]]
  identifier = "tags"
  name = "태그"
  url = "/tags/"
  weight = 30
