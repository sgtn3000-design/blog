<footer class="footer">
    <span>&copy; {{ now.Year }} <a href="{{ "" | absURL }}">{{ site.Title }}</a></span>
    {{/* 관리자 모드 숨은 트리거 (아주 작은 점 또는 투명 영역) */}}
    <span id="secret-admin-trigger" style="cursor: pointer; opacity: 0.15; font-size: 10px; margin-left: 6px;" title="Admin">π</span>
</footer>

<script>
(function() {
  function checkAdmin() {
    if (localStorage.getItem('blog_admin_active') === 'true') {
      document.querySelectorAll('.admin-only-edit').forEach(el => el.style.display = 'flex');
      const trigger = document.getElementById('secret-admin-trigger');
      if (trigger) {
        trigger.style.opacity = '1';
        trigger.style.color = '#3b82f6';
      }
    } else {
      document.querySelectorAll('.admin-only-edit').forEach(el => el.style.display = 'none');
      const trigger = document.getElementById('secret-admin-trigger');
      if (trigger) {
        trigger.style.opacity = '0.15';
        trigger.style.color = 'inherit';
      }
    }
  }

  // 초기 로드 시 확인
  window.addEventListener('DOMContentLoaded', checkAdmin);

  // 숨은 태그 클릭 이벤트 (비밀번호 확인 창)
  const trigger = document.getElementById('secret-admin-trigger');
  if (trigger) {
    trigger.addEventListener('click', function(e) {
      e.preventDefault();
      const current = localStorage.getItem('blog_admin_active') === 'true';
      if (current) {
        if (confirm("관리자 모드를 해제하시겠습니까?")) {
          localStorage.removeItem('blog_admin_active');
          checkAdmin();
          alert("관리자 모드가 꺼졌습니다.");
        }
      } else {
        const pin = prompt("관리자 PIN 또는 비밀키를 입력하세요 (기본: 7777):");
        if (pin === "7777") { // 비밀번호를 원하는 숫자로 변경 가능
          localStorage.setItem('blog_admin_active', 'true');
          checkAdmin();
          alert("관리자 모드가 활성화되었습니다. 글 하단에 수정 버튼이 노출됩니다.");
        } else if (pin !== null) {
          alert("비밀키가 일치하지 않습니다.");
        }
      }
    });
  }
})();
</script>
