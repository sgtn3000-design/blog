<footer class="footer">
    <span>&copy; {{ now.Year }} <a href="{{ "" | absURL }}">{{ site.Title }}</a></span>
    <span id="secret-admin-trigger" style="cursor: pointer; opacity: 0.2; font-size: 13px; margin-left: 8px; padding: 4px 6px; user-select: none;" title="Admin">π</span>
</footer>

<script>
(function() {
  const REPO = 'sgtn3000-design/blog';
  const BRANCH = 'main';

  function applyAdmin(active) {
    const trigger = document.getElementById('secret-admin-trigger');
    if (active) {
      document.body.classList.add('is-admin');
      if (trigger) {
        trigger.style.opacity = '1';
        trigger.style.color = '#3b82f6';
        trigger.style.fontWeight = 'bold';
      }
    } else {
      document.body.classList.remove('is-admin');
      if (trigger) {
        trigger.style.opacity = '0.2';
        trigger.style.color = 'inherit';
        trigger.style.fontWeight = 'normal';
      }
    }
  }

  // 초기 상태 반영
  applyAdmin(localStorage.getItem('blog_admin_active') === 'true');

  // 파이 기호 클릭 이벤트
  const trigger = document.getElementById('secret-admin-trigger');
  if (trigger) {
    trigger.onclick = function(e) {
      e.preventDefault();
      const current = localStorage.getItem('blog_admin_active') === 'true';
      if (current) {
        if (confirm("관리자 모드를 끄시겠습니까?")) {
          localStorage.removeItem('blog_admin_active');
          applyAdmin(false);
          alert("관리자 모드가 해제되었습니다.");
        }
      } else {
        const pin = prompt("관리자 PIN 번호를 입력하세요:");
        if (pin === "7777") {
          localStorage.setItem('blog_admin_active', 'true');
          applyAdmin(true);
          alert("관리자 모드가 활성화되었습니다!");
        } else if (pin !== null) {
          alert("비밀번호가 올바르지 않습니다.");
        }
      }
    };
  }

  // 본문 하단 글 삭제 버튼 이벤트
  const delBtn = document.getElementById('admin-delete-post-btn');
  if (delBtn) {
    delBtn.onclick = async function(e) {
      e.preventDefault();
      const token = localStorage.getItem('blog_gh_token');
      if (!token) {
        alert("GitHub 토큰이 필요합니다. 상단 관리자 글쓰기에서 먼저 저장해 주세요.");
        return;
      }
      const filePath = delBtn.getAttribute('data-filepath');
      const coverImg = delBtn.getAttribute('data-coverimage');
      if (!confirm("정말로 이 글을 삭제하시겠습니까?")) return;

      delBtn.disabled = true;
      delBtn.innerText = "삭제 진행 중...";

      try {
        const fileRes = await fetch("https://api.github.com/repos/" + REPO + "/contents/" + filePath + "?ref=" + BRANCH + "&t=" + Date.now(), {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!fileRes.ok) throw new Error("글 정보를 읽지 못했습니다.");
        const fileData = await fileRes.json();

        const delRes = await fetch("https://api.github.com/repos/" + REPO + "/contents/" + filePath, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: "delete: post " + filePath, sha: fileData.sha, branch: BRANCH })
        });
        if (!delRes.ok) throw new Error("포스트 삭제 실패");

        // 연결된 이미지 정리
        if (coverImg && !coverImg.includes("category-default")) {
          const cleanImg = "static/" + (coverImg.startsWith("/") ? coverImg.slice(1) : coverImg);
          try {
            const imgRes = await fetch("https://api.github.com/repos/" + REPO + "/contents/" + cleanImg + "?ref=" + BRANCH, {
              headers: { 'Authorization': 'Bearer ' + token }
            });
            if (imgRes.ok) {
              const imgData = await imgRes.json();
              await fetch("https://api.github.com/repos/" + REPO + "/contents/" + cleanImg, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: "cleanup: " + cleanImg, sha: imgData.sha, branch: BRANCH })
              });
            }
          } catch(err) {}
        }

        alert("삭제가 완료되었습니다!");
        window.location.href = "{{ "" | absURL }}?v=" + Date.now();
      } catch(err) {
        alert("삭제 오류: " + err.message);
        delBtn.disabled = false;
        delBtn.innerText = "삭제하기";
      }
    };
  }
})();
</script>
