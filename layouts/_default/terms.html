{{- define "main" }}
<div class="list-header">
  <h2 class="list-title">{{ .Title }}</h2>
</div>
<div class="terms-tags">
  <ul class="terms-list">
    {{- range $key, $value := .Data.Terms }}
    <li>
      <a href="{{ "/" | relLangURL }}{{ $.Data.Plural | urlize }}/{{ $key | urlize }}">{{ $key }} <sup><strong><sup>{{ len $value }}</sup></strong></sup></a>
    </li>
    {{- end }}
  </ul>
</div>
{{- end }}
