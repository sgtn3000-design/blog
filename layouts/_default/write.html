{{- define "hero" }}{{- end }}
{{- define "main" }}
<div class="editor-container" style="max-width: 860px; margin: 0 auto; padding: 1.5rem 1rem;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
    <h2 style="margin: 0; font-size: 1.5rem;">✍️ 새 글 작성기</h2>
    <a href="{{ "" | absURL }}" style="font-size: 0.9rem; color: #666; text-decoration: none;">← 홈으로 돌아가기</a>
  </div>

  <div id="token-box" style="display: none; background: #fff3cd; border: 1px solid #ffeeba; padding: 12px 16px; border-radius: 6px; margin-bottom: 1.5rem; font-size: 0.88rem; color: #856404;">
    <strong>최초 1회 설정:</strong> GitHub Personal Access Token이 필요합니다. (브라우저에 암호화 보관되어 이후 로그인 불필요)
    <div style="display: flex; gap: 8px; margin-top: 8px;">
      <input type="password" id="gh-token" placeholder="ghp_로 시작하는 깃허브 토큰 입력" style="flex: 1; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px;" />
      <button id="save-token-btn" style="padding: 6px 14px; background: #3b82f6; color: #fff; border: none; border-radius: 4px; cursor: pointer;">저장</button>
    </div>
  </div>

  <div class="editor-form" style="display: flex; flex-direction: column; gap: 14px;">
    <div>
      <input type="text" id="post-title" placeholder="글 제목을 입력하세요" style="width: 100%; font-size: 1.3rem; font-weight: bold; padding: 12px 14px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; background: var(--theme); color: var(--content);" />
    </div>

    <div style="display: flex; gap: 12px;">
      <input type="text" id="post-category" placeholder="카테고리 (예: 시황, 단상)" style="flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; background: var(--theme); color: var(--content);" />
      <input type="text" id="post-cover" placeholder="대표 이미지 경로 (선택: /images/xxx.webp)" style="flex: 2; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; background: var(--theme); color: var(--content);" />
    </div>

    <div>
      <textarea id="post-content" rows="18" placeholder="본문 내용을 입력하세요 (마크다운 및 일반 텍스트 모두 지원)" style="width: 100%; font-size: 1rem; line-height: 1.6; padding: 14px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-family: inherit; resize: vertical; background: var(--theme); color: var(--content);"></textarea>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem;">
      <span id="status-msg" style="font-size: 0.9rem; font-weight: 500;"></span>
      <div style="display: flex; gap: 10px;">
        <button id="reset-token-btn" style="padding: 10px 14px; background: transparent; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 0.85rem; color: #888;">토큰 재설정</button>
        <button id="publish-btn" style="padding: 10px 24px; background: #3b82f6; color: #fff; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem;">🚀 블로그에 발행하기</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  const REPO = 'sgtn3000-design/blog';
  const BRANCH = 'main';

  const tokenBox = document.getElementById('token-box');
  const tokenInput = document.getElementById('gh-token');
  const saveTokenBtn = document.getElementById('save-token-btn');
  const resetTokenBtn = document.getElementById('reset-token-btn');
  const publishBtn = document.getElementById('publish-btn');
  const statusMsg = document.getElementById('status-msg');

  function getToken() {
    return localStorage.getItem('blog_gh_token') || '';
  }

  function checkToken() {
    if (!getToken()) {
      tokenBox.style.display = 'block';
    } else {
      tokenBox.style.display = 'none';
    }
  }

  saveTokenBtn.addEventListener('click', () => {
    const val = tokenInput.value.trim();
    if (val) {
      localStorage.setItem('blog_gh_token', val);
      checkToken();
      alert('토큰이 안전하게 브라우저에 저장되었습니다. 이제 바로 글을 쓰실 수 있습니다.');
    }
  });

  resetTokenBtn.addEventListener('click', () => {
    if (confirm('저장된 깃허브 토큰을 지우고 다시 설정하시겠습니까?')) {
      localStorage.removeItem('blog_gh_token');
      tokenInput.value = '';
      checkToken();
    }
  });

  checkToken();

  // 발행 로직 (GitHub API 직접 호출)
  publishBtn.addEventListener('click', async () => {
    const token = getToken();
    if (!token) {
      alert('먼저 상단에 토큰을 입력하고 저장해 주세요.');
      tokenBox.style.display = 'block';
      return;
    }

    const title = document.getElementById('post-title').value.trim();
    const category = document.getElementById('post-category').value.trim() || '일반';
    const cover = document.getElementById('post-cover').value.trim();
    const content = document.getElementById('post-content').value.trim();

    if (!title || !content) {
      alert('제목과 본문은 필수 입력 사항입니다.');
      return;
    }

    publishBtn.disabled = true;
    publishBtn.style.opacity = '0.5';
    statusMsg.innerText = '⏳ GitHub로 글을 발행하는 중입니다...';
    statusMsg.style.color = '#3b82f6';

    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const yyyy = now.getFullYear();
    const mm = pad(now.getMonth() + 1);
    const dd = pad(now.getDate());
    const hh = pad(now.getHours());
    const min = pad(now.getMinutes());
    const ss = pad(now.getSeconds());

    const filename = `${yyyy}${mm}${dd}${hh}${min}${ss}.md`;
    const dateStr = `${yyyy}-${mm}-${dd}T${hh}:${min}:${ss}+09:00`;

    let coverBlock = '';
    if (cover) {
      coverBlock = `cover:\n  image: "${cover}"\n`;
    }

    const fileText = `---
title: "${title.replace(/"/g, '\\"')}"
date: ${dateStr}
categories:
  - "${category}"
${coverBlock}---

${content}
`;

    // UTF-8 base64 인코딩
    const encoded = btoa(unescape(encodeURIComponent(fileText)));

    try {
      const res = await fetch(`https://api.github.com/repos/${REPO}/contents/content/posts/${filename}`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `feat: new post "${title}" via web editor`,
          content: encoded,
          branch: BRANCH
        })
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.message || '발행 실패');
      }

      statusMsg.innerText = '✅ 글 발행 성공! 약 1분 후 블로그에 반영됩니다.';
      statusMsg.style.color = '#10b981';
      alert('발행이 완료되었습니다! Cloudflare가 배포를 시작합니다 (약 1분 소요).');
      window.location.href = '{{ "" | absURL }}';
    } catch (e) {
      console.error(e);
      statusMsg.innerText = `❌ 오류: ${e.message}`;
      statusMsg.style.color = '#ef4444';
      alert(`발행 중 문제가 발생했습니다: ${e.message}`);
    } finally {
      publishBtn.disabled = false;
      publishBtn.style.opacity = '1';
    }
  });
})();
</script>
{{- end }}
