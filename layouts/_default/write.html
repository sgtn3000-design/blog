{{- define "hero" }}{{- end }}
{{- define "main" }}
<div class="editor-container" style="max-width: 880px; margin: 0 auto; padding: 1.5rem 1rem;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
    <h2 id="editor-page-title" style="margin: 0; font-size: 1.5rem;">✍️ 블로그 글 & WebP 사진 저작도구</h2>
    <a href="{{ "" | absURL }}" style="font-size: 0.9rem; color: #666; text-decoration: none;">← 홈으로 돌아가기</a>
  </div>
  <div id="token-box" style="display: none; background: #fff3cd; border: 1px solid #ffeeba; padding: 12px 16px; border-radius: 6px; margin-bottom: 1.5rem; font-size: 0.88rem; color: #856404;">
    <strong>최초 1회 설정:</strong> GitHub Personal Access Token이 필요합니다.
    <div style="display: flex; gap: 8px; margin-top: 8px;">
      <input type="password" id="gh-token" placeholder="ghp_로 시작하는 깃허브 토큰 입력" style="flex: 1; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px;" />
      <button id="save-token-btn" style="padding: 6px 14px; background: #3b82f6; color: #fff; border: none; border-radius: 4px; cursor: pointer;">저장</button>
    </div>
  </div>
  <div class="editor-form" style="display: flex; flex-direction: column; gap: 14px;">
    <div><input type="text" id="post-title" placeholder="글 제목을 입력하세요" style="width: 100%; font-size: 1.3rem; font-weight: bold; padding: 12px 14px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; background: var(--theme); color: var(--content);" /></div>
    <div style="display: flex; gap: 12px;">
      <input type="text" id="post-category" placeholder="카테고리 (예: 시황, 단상)" style="flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; background: var(--theme); color: var(--content);" />
      <input type="text" id="post-cover" placeholder="대표 커버 이미지 경로 (사진 업로드 시 자동 입력)" style="flex: 2; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; background: var(--theme); color: var(--content);" />
    </div>
    <div id="drop-zone" style="border: 2px dashed #3b82f6; border-radius: 8px; padding: 1.2rem; text-align: center; background: rgba(59, 130, 246, 0.03); cursor: pointer;">
      <p style="margin: 0 0 6px 0; font-size: 0.95rem; font-weight: 600; color: #2563eb;">📸 사진 추가 (클릭하거나 이미지를 여기로 드래그)</p>
      <p style="margin: 0; font-size: 0.8rem; color: #666;">고화질 사진을 넣으면 가로 1200px 리사이즈 및 <strong>WebP 초경량 압축</strong> 후 자동 업로드됩니다.</p>
      <input type="file" id="image-file-input" accept="image/*" style="display: none;" />
      <div style="margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #444;">
        <input type="checkbox" id="set-as-cover" checked />
        <label for="set-as-cover" style="cursor: pointer;">이 사진을 대표(커버) 이미지로도 자동 지정</label>
      </div>
      <div id="upload-status" style="margin-top: 8px; font-size: 0.85rem; font-weight: 500;"></div>
    </div>
    <div><textarea id="post-content" rows="18" placeholder="본문 내용 (사진 업로드 시 커서 자리에 마크다운 코드가 자동 삽입됩니다)" style="width: 100%; font-size: 1rem; line-height: 1.6; padding: 14px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-family: inherit; resize: vertical; background: var(--theme); color: var(--content);"></textarea></div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem;">
      <span id="status-msg" style="font-size: 0.9rem; font-weight: 500;"></span>
      <div style="display: flex; gap: 10px;">
        <button id="reset-token-btn" style="padding: 10px 14px; background: transparent; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 0.85rem; color: #888;">토큰 재설정</button>
        <button id="publish-btn" style="padding: 10px 24px; background: #3b82f6; color: #fff; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem;">🚀 블로그에 발행하기</button>
      </div>
    </div>
  </div>
</div>
<script>
(function() {
  const REPO = "sgtn3000-design/blog";
  const BRANCH = "main";
  const tokenBox = document.getElementById("token-box");
  const tokenInput = document.getElementById("gh-token");
  const saveTokenBtn = document.getElementById("save-token-btn");
  const resetTokenBtn = document.getElementById("reset-token-btn");
  const publishBtn = document.getElementById("publish-btn");
  const statusMsg = document.getElementById("status-msg");
  const pageTitle = document.getElementById("editor-page-title");
  const dropZone = document.getElementById("drop-zone");
  const fileInput = document.getElementById("image-file-input");
  const uploadStatus = document.getElementById("upload-status");
  const postTitle = document.getElementById("post-title");
  const postCategory = document.getElementById("post-category");
  const postCover = document.getElementById("post-cover");
  const postContent = document.getElementById("post-content");
  const setAsCover = document.getElementById("set-as-cover");

  const urlParams = new URLSearchParams(window.location.search);
  const editFilePath = urlParams.get("path");
  let existingSha = null;
  let existingDateStr = null;

  function getToken() { return localStorage.getItem("blog_gh_token") || ""; }
  function checkToken() { tokenBox.style.display = getToken() ? "none" : "block"; }
  saveTokenBtn.addEventListener("click", () => {
    const val = tokenInput.value.trim();
    if (val) { localStorage.setItem("blog_gh_token", val); checkToken(); alert("토큰 저장 완료!"); if (editFilePath) loadExistingPost(); }
  });
  resetTokenBtn.addEventListener("click", () => {
    if (confirm("토큰을 재설정하시겠습니까?")) { localStorage.removeItem("blog_gh_token"); tokenInput.value = ""; checkToken(); }
  });
  checkToken();

  async function loadExistingPost() {
    const token = getToken();
    if (!token) return;
    pageTitle.innerText = "✏️ 기존 글 수정 모드";
    publishBtn.innerText = "💾 수정 완료 및 반영";
    publishBtn.style.background = "#059669";
    statusMsg.innerText = "기존 글 데이터를 불러오는 중...";
    try {
      const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${editFilePath}`, {
        headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github.v3+json" }
      });
      if (!res.ok) throw new Error("불러오기 실패");
      const data = await res.json();
      existingSha = data.sha;
      const rawText = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ""))));
      const fmMatch = rawText.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
      if (fmMatch) {
        const fm = fmMatch[1], body = fmMatch[2];
        const t = fm.match(/title:\s*["']?(.*?)["']?$/m); if (t) postTitle.value = t[1];
        const c = fm.match(/categories:\s*\n\s*-\s*["']?(.*?)["']?$/m); if (c) postCategory.value = c[1];
        const img = fm.match(/image:\s*["']?(.*?)["']?$/m); if (img) postCover.value = img[1];
        const d = fm.match(/date:\s*(.*?)$/m); if (d) existingDateStr = d[1].trim();
        postContent.value = body.trimStart();
      } else { postContent.value = rawText; }
      statusMsg.innerText = "";
    } catch(e) { statusMsg.innerText = e.message; statusMsg.style.color = "#ef4444"; }
  }
  if (editFilePath) loadExistingPost();

  dropZone.addEventListener("click", (e) => { if (e.target !== setAsCover && e.target.tagName !== "LABEL") fileInput.click(); });
  dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.style.background = "rgba(59, 130, 246, 0.1)"; });
  dropZone.addEventListener("dragleave", (e) => { e.preventDefault(); dropZone.style.background = "rgba(59, 130, 246, 0.03)"; });
  dropZone.addEventListener("drop", (e) => { e.preventDefault(); dropZone.style.background = "rgba(59, 130, 246, 0.03)"; if (e.dataTransfer.files.length) processAndUploadImage(e.dataTransfer.files[0]); });
  fileInput.addEventListener("change", (e) => { if (e.target.files.length) processAndUploadImage(e.target.files[0]); });

  function compressImageToWebP(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > 1200) { h = Math.round((h * 1200) / w); w = 1200; }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          const base64 = canvas.toDataURL("image/webp", 0.82).split(",")[1];
          resolve({ base64, size: (Math.round((base64.length * 3) / 4) / 1024).toFixed(1) });
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function processAndUploadImage(file) {
    const token = getToken();
    if (!token) { alert("토큰을 먼저 입력해 주세요."); tokenBox.style.display = "block"; return; }
    uploadStatus.innerText = "⚙️ WebP 압축 및 전송 중..."; uploadStatus.style.color = "#3b82f6";
    try {
      const comp = await compressImageToWebP(file);
      const name = `${Date.now()}_${Math.random().toString(36).substr(2,4)}.webp`;
      const res = await fetch(`https://api.github.com/repos/${REPO}/contents/static/images/${name}`, {
        method: "PUT",
        headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github.v3+json", "Content-Type": "application/json" },
        body: JSON.stringify({ message: `upload: ${name}`, content: comp.base64, branch: BRANCH })
      });
      if (!res.ok) throw new Error("업로드 실패");
      uploadStatus.innerText = `✅ 업로드 완료 (${comp.size}KB WebP)`; uploadStatus.style.color = "#10b981";
      const path = `/images/${name}`;
      if (setAsCover.checked || !postCover.value) postCover.value = path;
      const pos = postContent.selectionStart;
      postContent.value = postContent.value.slice(0, pos) + `\n\n![이미지](${path})\n\n` + postContent.value.slice(pos);
    } catch(err) { uploadStatus.innerText = `❌ ${err.message}`; uploadStatus.style.color = "#ef4444"; }
  }

  publishBtn.addEventListener("click", async () => {
    const token = getToken();
    if (!token) { alert("토큰이 필요합니다."); return; }
    const title = postTitle.value.trim(), cat = postCategory.value.trim() || "일반", cov = postCover.value.trim(), body = postContent.value.trim();
    if (!title || !body) { alert("제목과 본문을 입력하세요."); return; }
    publishBtn.disabled = true;
    statusMsg.innerText = "⏳ 저장 중...";
    const now = new Date();
    const pad = n => String(n).padStart(2, "0");
    const filename = editFilePath ? editFilePath : `content/posts/${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.md`;
    const dateStr = existingDateStr ? existingDateStr : `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}+09:00`;
    const coverText = cov ? `cover:\n  image: "${cov}"\n` : "";
    const fullText = `---\ntitle: "${title.replace(/"/g, "\"")}"\ndate: ${dateStr}\ncategories:\n  - "${cat}"\n${coverText}---\n\n${body}\n`;
    const payload = { message: editFilePath ? `fix: update "${title}"` : `feat: new post "${title}"`, content: btoa(unescape(encodeURIComponent(fullText))), branch: BRANCH };
    if (editFilePath && existingSha) payload.sha = existingSha;

    try {
      const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${filename}`, {
        method: "PUT",
        headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github.v3+json", "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("저장 실패");
      alert(editFilePath ? "수정 완료!" : "발행 완료!");
      window.location.href = "{{ "" | absURL }}";
    } catch(e) { alert("에러: " + e.message); } finally { publishBtn.disabled = false; }
  });
})();
</script>
{{- end }}
